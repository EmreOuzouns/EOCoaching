<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmreOuzoun AI Coach — İndir / Kur</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: var(--bg-gradient); min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 20px;">
    <div class="glass-card animate-scale-up" style="max-width:520px; width:100%; text-align:center; padding:32px 24px;">
        <img src="/icons/icon-192.png" alt="EOCoaching" style="width:68px; height:68px; border-radius:50%; margin-bottom:14px;">
        <h1 style="font-family:var(--font-header); font-size:1.8rem; margin-bottom:10px;">EmreOuzoun AI Coach</h1>
        <p class="subtitle" style="margin-bottom:24px;">
            Cihazını otomatik algılayarak Windows, Mac, Android veya iPhone için tek tıkla kurulumu başlatır.
        </p>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button type="button" id="btn-smart-dl" class="btn btn-primary btn-glow" style="width:100%;">
                <i class="fa-solid fa-download"></i> Cihazın İçin İndir / Kur
            </button>
            <a href="/" class="btn btn-secondary" style="width:100%; text-decoration:none;">
                <i class="fa-solid fa-play"></i> Web Uygulamasını Aç
            </a>
        </div>
    </div>

    <script>
        let deferredPrompt = null;
        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        document.getElementById("btn-smart-dl").addEventListener("click", async () => {
            const ua = navigator.userAgent || "";
            if (/android/i.test(ua)) {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                } else {
                    alert("Android Ana Ekrana Kurulum:\nChrome sağ üst köşedeki (⋮) menüsünden 'Uygulamayı Yükle / Ana ekrana ekle' seçeneğine dokunun.");
                }
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                window.location.href = "/api/download/ios-profile";
            } else if (/macintosh|mac os x/i.test(ua)) {
                window.location.href = "/api/download/mac";
            } else {
                window.location.href = "/api/download/windows";
            }
        });
    </script>
</body>
</html>
